name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: courier_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/courier_db?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/courier_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: dev-access-super-secret-key-change-in-prod-12345
      JWT_REFRESH_SECRET: dev-refresh-super-secret-key-change-in-prod-67890
      API_KEY_ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      KAFKA_BROKERS: ""

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 11.20.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Deploy Migrations to Test Database
        run: pnpm db:migrate:deploy

      - name: Seed Database
        run: pnpm db:seed

      - name: Lint Workspace
        run: pnpm lint

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Run Test Suite
        run: pnpm test

      - name: Build Web & API
        run: pnpm build

      - name: Verify API Docker Build
        run: docker build -f docker/Dockerfile.api -t courier-api:ci .

      - name: Verify Web Docker Build
        run: docker build -f docker/Dockerfile.web -t courier-web:ci .
