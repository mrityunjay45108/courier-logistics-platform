name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 11.20.0

      - name: Install Dependencies
        run: pnpm install

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Run Test Suite
        run: pnpm test

      - name: Build Web & API
        run: pnpm build
